<style>
  /* ===== Schriften (liegen im Ordner fonts, kein Google) ===== */
  @font-face { font-family: Inter; font-weight: 400; font-display: swap; src: url(fonts/inter-400.ttf) format("truetype"); }
  @font-face { font-family: Inter; font-weight: 500; font-display: swap; src: url(fonts/inter-500.ttf) format("truetype"); }
  @font-face { font-family: Inter; font-weight: 600; font-display: swap; src: url(fonts/inter-600.ttf) format("truetype"); }
  @font-face { font-family: "Tenor Sans"; font-weight: 400; font-display: swap; src: url(fonts/tenor-sans.ttf) format("truetype"); }

  /* ===== Farben (aus deinem Profil: Anthrazit, Silber, Eisblau, Off-White) ===== */
  :root {
    --anthrazit: #15171A;
    --silber: #C7CCD1;
    --eisblau: #A8C4D4;
    --eisblau-dunkel: #6F98AE;
    --hell: #F0EEE9;
    --weiss: #FFFFFF;
    --rot: #C0392B;
    --gelb: #C98F0A;
    --gruen: #2E8B57;
    --rand: rgba(21, 23, 26, .09);
    --schatten: 0 1px 2px rgba(21, 23, 26, .05), 0 8px 24px -12px rgba(21, 23, 26, .14);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; font-family: Inter, system-ui, sans-serif; font-size: 16px; line-height: 1.55; background: var(--hell); color: var(--anthrazit); }

  /* ----- Kopfzeile und Navigation ----- */
  .oben { background: var(--anthrazit); position: sticky; top: 0; z-index: 20; }
  .oben-in { max-width: 900px; margin: 0 auto; padding: 0 16px; height: 62px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
  .logo { display: flex; align-items: center; gap: 10px; color: var(--hell); text-decoration: none; font-family: "Tenor Sans", Georgia, serif; font-size: 21px; }
  .logo-mark { width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--eisblau); display: grid; place-items: center; }
  .logo-mark svg { width: 17px; height: 17px; stroke: var(--eisblau); fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .nav-oben { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
  .nav-oben a { padding: 8px 12px; border-radius: 10px; color: var(--silber); text-decoration: none; font-weight: 500; font-size: 14.5px; transition: .2s; }
  .nav-oben a:hover { color: var(--hell); background: rgba(255, 255, 255, .06); }
  .nav-oben a.aktiv, .nav-unten a.aktiv { color: var(--eisblau); background: rgba(168, 196, 212, .14); }
  .nav-unten { display: none; }
  .nav-unten svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  main { max-width: 820px; margin: 0 auto; padding: 26px 16px 8px; }
  h2 { font-family: "Tenor Sans", Georgia, serif; font-weight: 400; font-size: 30px; line-height: 1.15; margin: 0 0 20px; letter-spacing: .01em; }
  h3 { margin: 26px 0 10px; font-size: 12.5px; text-transform: uppercase; letter-spacing: .14em; color: #6a7076; font-weight: 600; }

  .karte { background: var(--weiss); border: 1px solid var(--rand); border-radius: 16px; padding: 18px; margin-bottom: 12px; box-shadow: var(--schatten); }
  .zeile { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .klein { font-size: 13px; color: #5b6168; }
  .marke { display: inline-block; padding: 4px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .ueberfaellig { background: var(--rot); color: #fff; }
  .bald { background: var(--gelb); color: #fff; }
  .ok { background: var(--gruen); color: #fff; }
  .grau { background: var(--silber); color: var(--anthrazit); }
  .rand-ueberfaellig { border-left: 5px solid var(--rot); }
  .rand-bald { border-left: 5px solid var(--gelb); }
  .rand-ok { border-left: 5px solid var(--gruen); }
  .ausser-betrieb { background: var(--rot); color: #fff; padding: 14px 16px; border-radius: 14px; margin-bottom: 12px; font-weight: 600; }

  .zahlen { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .zahlen div { display: flex; flex-direction: column; align-items: center; padding: 16px 8px; border-radius: 16px; color: #fff; font-weight: 500; font-size: 13.5px; box-shadow: var(--schatten); }
  .zahlen b { font-family: "Tenor Sans", Georgia, serif; font-weight: 400; font-size: 34px; line-height: 1.1; }

  label { display: block; margin: 14px 0 5px; font-weight: 600; font-size: 14px; }
  label.haken { display: flex; gap: 8px; align-items: center; font-weight: 400; }
  label.haken input { width: auto; }
  input, select, textarea { width: 100%; padding: 12px 13px; font: inherit; font-size: 16px; border: 1px solid #cfd3d7; border-radius: 10px; background: var(--weiss); color: var(--anthrazit); }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--eisblau); outline-offset: 1px; border-color: var(--eisblau-dunkel); }
  button { background: var(--anthrazit); color: var(--hell); border: 0; border-radius: 12px; padding: 13px 22px; font: inherit; font-size: 15px; font-weight: 500; cursor: pointer; margin: 14px 8px 0 0; transition: transform .15s, box-shadow .2s; }
  button:hover { transform: translateY(-1px); box-shadow: 0 8px 18px -8px rgba(21, 23, 26, .5); }
  button.zweit { background: var(--eisblau); color: var(--anthrazit); }
  button.loeschen { background: transparent; color: var(--rot); border: 1px solid var(--rot); }
  button.mini { padding: 6px 12px; font-size: 13px; margin: 0; border-radius: 9px; }
  a.titel { color: var(--anthrazit); font-weight: 600; font-size: 17px; text-decoration: none; }
  a.titel:hover { text-decoration: underline; }
  .hinweis { font-size: 12px; color: #6a7076; text-align: center; padding: 26px 16px 30px; max-width: 640px; margin: 0 auto; }
  .leer { color: #6a7076; font-style: italic; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 6px 0 14px; }
  th, td { border: 1px solid var(--silber); padding: 6px 8px; text-align: left; vertical-align: top; }
  th { background: var(--hell); }
  .qr-etikett { text-align: center; border: 2px dashed var(--silber); padding: 16px; break-inside: avoid; background: var(--weiss); border-radius: 12px; }
  .qr-etikett svg { width: 200px; height: 200px; }
  .qr-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }

  /* ----- Etappe 2: Listen, Geraetekarte, Formulare ----- */
  .aktionen { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 6px; }
  .aktionen a { text-decoration: none; }
  .aktionen button { margin: 8px 0 0 0; }
  .zurueck { display: inline-block; color: #5b6168; text-decoration: none; font-weight: 500; font-size: 14.5px; margin-bottom: 14px; }
  .zurueck:hover { color: var(--anthrazit); }
  .geraet-zeile { display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit; }
  .geraet-zeile .mitte { flex: 1; min-width: 0; }
  .geraet-zeile .rechts { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .titel-fett { display: block; font-size: 17px; font-weight: 600; }
  .icon-kreis { width: 46px; height: 46px; border-radius: 14px; background: rgba(168, 196, 212, .28); display: grid; place-items: center; flex: none; }
  .icon-kreis svg { width: 24px; height: 24px; stroke: #3d6378; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 14px; }
  .chip { font-size: 13px; padding: 4px 12px; border-radius: 99px; background: rgba(21, 23, 26, .06); color: #3d4349; font-weight: 500; }
  .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 16px; margin: 0 0 16px; font-size: 14.5px; }
  .meta small { display: block; font-size: 12px; color: #6a7076; text-transform: uppercase; letter-spacing: .08em; }
  .punkt-kopf { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .punkt-kopf strong { font-size: 17px; }
  .felder { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .felder .breit { grid-column: 1 / -1; }
  button.gruen { background: var(--gruen); color: #fff; }
  button.warn { background: transparent; color: #9a6a00; border: 1.5px solid var(--gelb); }
  .verlauf { margin-top: 12px; padding-top: 10px; border-top: 1px dashed #d5d8db; }
  .verlauf-zeile { font-size: 13.5px; color: #4a5056; padding: 3px 0; }
  details.neu { background: var(--weiss); border: 1px solid var(--rand); border-radius: 16px; padding: 4px 18px; margin: 4px 0 14px; box-shadow: var(--schatten); }
  details.neu summary { cursor: pointer; font-weight: 600; padding: 14px 0; list-style: none; display: flex; justify-content: space-between; align-items: center; }
  details.neu summary::-webkit-details-marker { display: none; }
  details.neu summary::after { content: "+"; color: var(--eisblau-dunkel); font-size: 24px; line-height: 1; transition: .2s; }
  details.neu[open] summary::after { transform: rotate(45deg); }
  details.neu[open] { padding-bottom: 18px; }
  .leer-karte { text-align: center; padding: 34px 20px; }
  .leer-karte p { color: #5b6168; margin: 0 0 6px; }
  .formular { padding: 22px; }
  .formular .zeile-knoepfe { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
  .formular .zeile-knoepfe a { color: #5b6168; text-decoration: none; margin-top: 14px; font-weight: 500; }
  .gefahr { margin-top: 26px; text-align: center; }

  /* ----- Etappe 3: Personal, Unterweisung, Sicherung ----- */
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: rgba(168, 196, 212, .35); color: #2f5368; display: grid; place-items: center; font-weight: 600; font-size: 14px; flex: none; }
  .person { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--rand); }
  .person:last-of-type { border-bottom: 0; }
  .person span.name { flex: 1; font-weight: 500; }
  .neue-person { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-top: 10px; }
  .neue-person > div { flex: 1; min-width: 200px; }
  .neue-person button { margin: 0; }
  .teil-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 8px; margin-top: 6px; }
  .teil-grid label.haken { background: #f6f7f8; border: 1px solid var(--rand); border-radius: 12px; padding: 11px 12px; margin: 0; cursor: pointer; font-weight: 500; }
  .teil-grid label.haken input { width: 18px; height: 18px; }
  .info-karte { background: rgba(168, 196, 212, .22); border: 1px solid rgba(111, 152, 174, .35); border-radius: 14px; padding: 12px 16px; font-size: 14.5px; color: #2f4757; margin-bottom: 16px; }
  .fehlt { background: #fff6e0; border: 1px solid #f0d9a0; border-radius: 14px; padding: 12px 16px; margin-bottom: 14px; font-size: 14.5px; }
  .karte ol { padding-left: 22px; margin: 4px 0 8px; }
  .karte ol li { margin-bottom: 10px; }
  .abschnitt-kopf { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .abschnitt-kopf .icon-kreis { width: 42px; height: 42px; }
  .abschnitt-kopf b { display: block; font-size: 17px; }
  .abschnitt-kopf span { color: #5b6168; font-size: 14px; }

  /* ----- Fenster (Mangel behoben) ----- */
  dialog.fenster { border: 0; border-radius: 20px; padding: 0; width: min(460px, calc(100vw - 32px)); box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .5); color: var(--anthrazit); }
  dialog.fenster::backdrop { background: rgba(21, 23, 26, .55); }
  dialog.fenster form { padding: 22px; margin: 0; }
  dialog.fenster h2 { font-size: 24px; margin: 0 0 6px; }
  dialog.fenster .klein { margin: 0 0 6px; }
  dialog.fenster textarea { min-height: 90px; resize: vertical; }
  dialog.fenster .fenster-knoepfe { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .reparatur { font-size: 14px; padding: 8px 0; border-bottom: 1px solid var(--rand); }
  .reparatur:last-child { border-bottom: 0; }

  /* ----- Uebersicht: eine Karte pro Geraet ----- */
  .zaehler { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .zaehler span { font-size: 13px; font-weight: 600; padding: 4px 11px; border-radius: 99px; white-space: nowrap; }
  .rest-karte { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: var(--anthrazit); }
  .rest-karte i { font-style: normal; color: var(--eisblau-dunkel); font-size: 22px; }
  .alles-gut { text-align: center; padding: 26px 18px; }
  .alles-gut b { display: block; font-size: 18px; margin-bottom: 4px; }

  /* ----- Willkommen (leerer Start) ----- */
  .willkommen { text-align: center; padding: 34px 22px 28px; }
  .willkommen h2 { font-size: 28px; margin-bottom: 10px; }
  .willkommen > p { color: #4a5056; max-width: 460px; margin: 0 auto; }
  .schritte { display: grid; gap: 14px; margin: 26px auto 8px; max-width: 460px; text-align: left; }
  .schritt { display: flex; gap: 14px; align-items: flex-start; }
  .schritt .nr { width: 34px; height: 34px; border-radius: 50%; background: var(--anthrazit); color: var(--eisblau); display: grid; place-items: center; font-family: "Tenor Sans", Georgia, serif; flex: none; }
  .schritt b { display: block; font-weight: 600; }
  .schritt span { color: #5b6168; font-size: 14.5px; }
  .willkommen .knoepfe { margin-top: 8px; }

  /* ----- Mehr-Seite ----- */
  .menue-eintrag { display: flex; align-items: center; justify-content: space-between; gap: 12px; text-decoration: none; color: var(--anthrazit); }
  .menue-eintrag b { display: block; font-weight: 600; }
  .menue-eintrag span { color: #5b6168; font-size: 14px; }
  .menue-eintrag i { font-style: normal; color: var(--eisblau-dunkel); font-size: 22px; }

  /* ----- Am Handy: Navigationsleiste unten ----- */
  @media (max-width: 719px) {
    .nav-oben { display: none; }
    .nav-unten { display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; background: var(--anthrazit); padding: 6px 6px calc(6px + env(safe-area-inset-bottom)); justify-content: space-around; box-shadow: 0 -8px 24px rgba(0, 0, 0, .25); }
    .nav-unten a { display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--silber); text-decoration: none; font-size: 11.5px; font-weight: 500; padding: 7px 8px; border-radius: 12px; min-width: 60px; }
    .nav-unten a.plus { color: #12161A; background: var(--eisblau); }
    body { padding-bottom: 88px; }
    h2 { font-size: 26px; }
    button { padding: 14px 20px; }
    .felder { grid-template-columns: 1fr; }
    .meta { grid-template-columns: 1fr 1fr; }
  }

  /* ===== Druckansicht (für PDF und QR-Etiketten) ===== */
  @media print {
    header, .oben, .nav-unten, .nicht-drucken, dialog { display: none !important; }
    body { padding-bottom: 0 !important; }
    body { background: #fff; }
    main { max-width: none; padding: 0; }
    .karte { border: 0; padding: 0; }
  }
</style>

<script>
/* =====================================================================
   SPEICHER
   Fürs Erste speichert der Browser alles selbst (localStorage).
   Vergleich: wie ein Notizblock, der nur an diesem einen Gerät liegt.
   Stufe 2 ersetzt das durch einen Server.
   ===================================================================== */
const SPEICHER_NAME = "wartungsbuch-daten";

function ladeDaten() {
  let d;
  try { d = JSON.parse(localStorage.getItem(SPEICHER_NAME)) || {}; } catch (e) { d = {}; }
  d.geraete = d.geraete || [];
  d.mitarbeiter = d.mitarbeiter || [];
  d.unterweisungen = d.unterweisungen || [];
  return d;
}

function speichereDaten() {
  localStorage.setItem(SPEICHER_NAME, JSON.stringify(daten));
}

let daten = ladeDaten();

/* =====================================================================
   FESTE LISTEN
   ===================================================================== */
const KATEGORIEN = [
  "Standmaschine",
  "Fahrzeug",
  "Ortsveränderliches Gerät",
  "Erste Hilfe & Brandschutz",
  "Gebäude & Sonstiges"
];

const INTERVALLE = [
  ["täglich", 1], ["wöchentlich", 7], ["monatlich", 30],
  ["vierteljährlich", 91], ["halbjährlich", 182], ["jährlich", 365],
  ["alle 2 Jahre", 730], ["alle 4 Jahre", 1461]
];

// Ab wie vielen Prüfpunkten ein Gerät als Großgerät zählt (wichtig für die Preise später)
const GROSSGERAET_AB = 6;

/* =====================================================================
   HILFSFUNKTIONEN
   ===================================================================== */
function neueId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
}

// Schutz: Text vom Benutzer wird sicher angezeigt (kein eingeschleuster Code)
function sicher(text) {
  const div = document.createElement("div");
  div.textContent = text ?? "";
  return div.innerHTML;
}

function wert(id) {
  const feld = document.getElementById(id);
  return feld ? feld.value.trim() : "";
}

function intervallName(tage) {
  const treffer = INTERVALLE.find(i => i[1] === tage);
  return treffer ? treffer[0] : "alle " + tage + " Tage";
}

function intervallAuswahl(id, vorwahl) {
  return `<select id="${id}">${INTERVALLE.map(i =>
    `<option value="${i[1]}" ${i[1] === vorwahl ? "selected" : ""}>${i[0]}</option>`).join("")}</select>`;
}

function heute() {
  const d = new Date();
  d.setHours(0, 0, 0, 0);
  return d;
}

// "2026-11-22" wird als Ortszeit gelesen, alles andere normal
function zuDatum(s) {
  const d = s.length === 10 ? new Date(s + "T00:00:00") : new Date(s);
  d.setHours(0, 0, 0, 0);
  return d;
}

function datumText(d) {
  return d.toLocaleDateString("de-DE");
}

function heuteISO() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}

// Ampel für alles, was regelmäßig fällig wird (Prüfpunkt oder Unterweisung)
function ampel(letztesDatum, intervallTage) {
  let faellig;
  if (!letztesDatum) {
    faellig = heute(); // noch nie gemacht = sofort fällig
  } else {
    faellig = zuDatum(letztesDatum);
    faellig.setDate(faellig.getDate() + intervallTage);
  }
  const tage = Math.round((faellig - heute()) / 86400000);
  if (tage < 0) return { klasse: "ueberfaellig", text: "überfällig seit " + datumText(faellig), tage };
  if (tage === 0) return { klasse: "ueberfaellig", text: "heute fällig", tage };
  if (tage === 1) return { klasse: "bald", text: "morgen fällig", tage };
  if (tage <= 7) return { klasse: "bald", text: "in " + tage + " Tagen", tage };
  return { klasse: "ok", text: "ok bis " + datumText(faellig), tage };
}

function statusPruefpunkt(pp) {
  const letzter = pp.eintraege[pp.eintraege.length - 1];
  // Offener Mangel bleibt rot, bis er behoben oder wieder als "in Ordnung" geprüft ist
  if (letzter && letzter.ergebnis === "mangel") return { klasse: "ueberfaellig", text: "Mangel offen", tage: -99999 };
  return ampel(letzter ? letzter.datum : null, pp.intervallTage);
}

function mangelOffen(pp) {
  const letzter = pp.eintraege[pp.eintraege.length - 1];
  return !!letzter && letzter.ergebnis === "mangel";
}

function ergebnisText(e, fett) {
  if (e.ergebnis === "ok") return "in Ordnung";
  if (e.ergebnis === "behoben") return "Mangel behoben";
  return fett ? "<b>MANGEL</b>" : "MANGEL";
}

function statusUnterweisung(u) {
  const letzte = u.durchfuehrungen[u.durchfuehrungen.length - 1];
  return ampel(letzte ? letzte.datum : null, u.intervallTage);
}

function marke(st) {
  return `<span class="marke ${st.klasse}">${st.text}</span>`;
}

function groesse(g) {
  return g.pruefpunkte.length >= GROSSGERAET_AB ? "Großgerät" : "Kleingerät";
}

function findeGeraet(id) { return daten.geraete.find(g => g.id === id); }
function findeUnterweisung(id) { return daten.unterweisungen.find(u => u.id === id); }

// Adresse, die im QR-Code steckt: führt direkt zum Gerät
function geraetAdresse(g) {
  return location.origin + location.pathname + "#/geraet/" + g.id;
}

function qrBild(text) {
  if (typeof qrcode === "undefined") {
    return `<p class="leer">QR-Code braucht beim ersten Mal Internet.</p>`;
  }
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  return qr.createSvgTag(6, 2);
}

/* =====================================================================
   SEITEN
   Die Adresse (#/...) bestimmt, welche Seite gezeigt wird.
   ===================================================================== */
const inhalt = document.getElementById("inhalt");

// Hebt in der Navigation die aktuelle Seite hervor
function markiereNav(seite) {
  const gruppe = { geraet: "geraete", qr: "geraete", "qr-alle": "geraete", protokoll: "geraete", unterweisung: "personal", "": "start" };
  const key = gruppe[seite] !== undefined ? gruppe[seite] : seite;
  document.querySelectorAll("nav a[data-seite]").forEach(a => {
    const unten = a.closest(".nav-unten");
    const ziel = unten && (key === "sicherung" || key === "installieren") ? "mehr" : key;
    a.classList.toggle("aktiv", a.dataset.seite === ziel);
  });
}

function zeigeSeite() {
  const [seite, id] = location.hash.replace("#/", "").split("/");
  window.scrollTo(0, 0);
  markiereNav(seite);
  if (seite === "mehr") return seiteMehr();
  if (seite === "geraete") return seiteGeraete();
  if (seite === "neu") return seiteNeu();
  if (seite === "geraet" && id) return seiteGeraet(id);
  if (seite === "qr" && id) return seiteQR(id);
  if (seite === "qr-alle") return seiteQRAlle();
  if (seite === "protokoll" && id) return seiteProtokoll(id);
  if (seite === "personal") return seitePersonal();
  if (seite === "unterweisung" && id) return seiteUnterweisung(id);
  if (seite === "sicherung") return seiteSicherung();
  if (seite === "installieren") return seiteInstallieren();
  return seiteUebersicht();
}

/* ---------- ÜBERSICHT: alles, was ansteht, das Dringendste oben ---------- */
function seiteUebersicht() {
  const liste = [];
  daten.geraete.forEach(g => g.pruefpunkte.forEach(pp => liste.push({
    link: "#/geraet/" + g.id, titel: g.name, text: pp.text,
    unter: intervallName(pp.intervallTage) + (pp.wer ? " · " + pp.wer : ""), st: statusPruefpunkt(pp)
  })));
  daten.unterweisungen.forEach(u => liste.push({
    link: "#/unterweisung/" + u.id, titel: "Unterweisung", text: u.thema,
    unter: intervallName(u.intervallTage), st: statusUnterweisung(u)
  }));
  liste.sort((a, b) => a.st.tage - b.st.tage);

  const ausser = daten.geraete.filter(g => g.ausserBetrieb);
  const rot = liste.filter(x => x.st.klasse === "ueberfaellig").length;
  const gelb = liste.filter(x => x.st.klasse === "bald").length;
  const gruen = liste.filter(x => x.st.klasse === "ok").length;

  if (daten.geraete.length === 0 && daten.unterweisungen.length === 0) {
    inhalt.innerHTML = `
      <div class="karte willkommen">
        <h2>Willkommen im Wartungsbuch</h2>
        <p>Hier siehst du später auf einen Blick, was ansteht. Fang mit deinem ersten Gerät an:</p>
        <div class="schritte">
          <div class="schritt"><div class="nr">1</div><div><b>Gerät anlegen</b><span>Name, Standort und Prüfpunkte trägst du selbst ein.</span></div></div>
          <div class="schritt"><div class="nr">2</div><div><b>QR-Code drucken</b><span>Ausdrucken und ans Gerät kleben.</span></div></div>
          <div class="schritt"><div class="nr">3</div><div><b>Scannen und abhaken</b><span>Mit dem Handy scannen, Prüfung erledigen, Nachweis ist gespeichert.</span></div></div>
        </div>
        <div class="knoepfe">
          <a href="#/neu"><button>Erstes Gerät anlegen</button></a>
          <a href="#/personal"><button class="zweit">Personal & Unterweisungen</button></a>
        </div>
      </div>`;
    return;
  }

  // Pro Geraet zaehlen: wie viele Punkte faellig, bald, in Ordnung
  const geraeteInfo = daten.geraete.map(g => {
    const st = g.pruefpunkte.map(statusPruefpunkt);
    return {
      g,
      rot: st.filter(x => x.klasse === "ueberfaellig").length,
      gelb: st.filter(x => x.klasse === "bald").length,
      gruen: st.filter(x => x.klasse === "ok").length,
      dringend: st.length ? Math.min(...st.map(x => x.tage)) : 99999
    };
  });
  const offen = geraeteInfo
    .filter(x => x.g.ausserBetrieb || x.rot || x.gelb)
    .sort((a, b) => (b.g.ausserBetrieb - a.g.ausserBetrieb) || (b.rot - a.rot) || (a.dringend - b.dringend));
  const fertig = geraeteInfo.length - offen.length;
  const gRot = offen.filter(x => x.g.ausserBetrieb || x.rot).length;
  const gGelb = offen.length - gRot;

  const uwOffen = daten.unterweisungen.map(u => statusUnterweisung(u)).filter(x => x.klasse !== "ok");
  const uwRot = uwOffen.filter(x => x.klasse === "ueberfaellig").length;
  const uwGelb = uwOffen.filter(x => x.klasse === "bald").length;

  inhalt.innerHTML = `
    <h2>Übersicht</h2>
    <div class="zahlen">
      <div class="ueberfaellig"><b>${gRot}</b>${gRot === 1 ? "Gerät" : "Geräte"} fällig</div>
      <div class="bald"><b>${gGelb}</b>${gGelb === 1 ? "Gerät" : "Geräte"} bald</div>
      <div class="ok"><b>${fertig}</b>in Ordnung</div>
    </div>

    ${offen.length ? `<h3>Geräte mit offenen Punkten (${offen.length})</h3>` : ""}
    ${offen.map(x => `
      <a class="karte geraet-zeile ${x.g.ausserBetrieb || x.rot ? "rand-ueberfaellig" : "rand-bald"}" href="#/geraet/${x.g.id}">
        ${katIcon(x.g.kategorie)}
        <div class="mitte">
          <b class="titel-fett">${sicher(x.g.name)}</b>
          <div class="klein">${sicher(x.g.standort)}${x.g.standort ? " · " : ""}${x.g.pruefpunkte.length} ${x.g.pruefpunkte.length === 1 ? "Prüfpunkt" : "Prüfpunkte"}</div>
        </div>
        <div class="zaehler">
          ${x.g.ausserBetrieb ? `<span class="ueberfaellig">außer Betrieb</span>` : ""}
          ${x.rot ? `<span class="ueberfaellig">${x.rot} fällig</span>` : ""}
          ${x.gelb ? `<span class="bald">${x.gelb} bald</span>` : ""}
        </div>
      </a>`).join("")}

    ${!offen.length && daten.geraete.length ? `
      <div class="karte alles-gut">
        <b>Alles erledigt</b>
        <span class="klein">Bei keinem Gerät ist gerade etwas fällig.</span>
      </div>` : ""}

    ${fertig ? `
      <a class="karte rest-karte" href="#/geraete">
        <div><b>${fertig} ${fertig === 1 ? "Gerät" : "Geräte"} ohne offene Punkte</b><div class="klein">Alle Maschinen ansehen</div></div><i>›</i>
      </a>` : ""}

    ${daten.unterweisungen.length ? `
      <h3>Unterweisungen</h3>
      <a class="karte geraet-zeile ${uwRot ? "rand-ueberfaellig" : uwGelb ? "rand-bald" : "rand-ok"}" href="#/personal">
        <div class="icon-kreis"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg></div>
        <div class="mitte">
          <b class="titel-fett">${daten.unterweisungen.length} ${daten.unterweisungen.length === 1 ? "Unterweisung" : "Unterweisungen"}</b>
          <div class="klein">Personal & Unterweisungen ansehen</div>
        </div>
        <div class="zaehler">
          ${uwRot ? `<span class="ueberfaellig">${uwRot} fällig</span>` : ""}
          ${uwGelb ? `<span class="bald">${uwGelb} bald</span>` : ""}
          ${!uwRot && !uwGelb ? `<span class="ok">alles ok</span>` : ""}
        </div>
      </a>` : ""}`;
}

    "Fahrzeug": '<circle cx="7" cy="17" r="2.2"/><circle cx="17" cy="17" r="2.2"/><path d="M3 17V12l2-4h9l4 4v5M9.2 17h5.6"/>',
    "Ortsveränderliches Gerät": '<path d="M13 3L5 14h6l-1 7 8-11h-6z"/>',
    "Erste Hilfe & Brandschutz": '<path d="M12 3c3 4 5 6.5 5 9.5a5 5 0 01-10 0C7 9.5 9 7 12 3z"/>',
    "Gebäude & Sonstiges": '<path d="M3 21V9l9-6 9 6v12zM9 21v-6h6v6"/>'

  return '<div class="icon-kreis"><svg viewBox="0 0 24 24">' + (w[k] || w["Standmaschine"]) + '</svg></div>';

function geraetSpeichern() {
  const name = wert("name");
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  const g = {
    id: neueId(), name,
    kategorie: wert("kategorie"), standort: wert("standort"),
    typ: wert("typ"), nummer: wert("nummer"),
    ausserBetrieb: false, pruefpunkte: []
  };
  daten.geraete.push(g);
  speichereDaten();
  location.hash = "#/geraet/" + g.id;
}

/* ---------- EIN GERÄT: Prüfpunkte, abhaken, Verlauf ---------- */
function seiteGeraet(id) {
  const g = findeGeraet(id);
  if (!g) {
    inhalt.innerHTML = `<p class="leer">Gerät nicht gefunden. (Hinweis: Bis zu Stufe 2 sind die Daten nur auf dem Gerät gespeichert, auf dem sie eingetragen wurden.)</p>`;
    return;
  }

  const punkte = g.pruefpunkte.map(pp => {
    const st = statusPruefpunkt(pp);
    const verlauf = pp.eintraege.slice().reverse().slice(0, 5).map(e => `
      <div class="verlauf-zeile">${datumText(zuDatum(e.datum))} · ${sicher(e.pruefer)} · ${ergebnisText(e, true)}${e.bemerkung ? " · " + sicher(e.bemerkung) : ""}</div>`).join("");
    return `
      <div class="karte rand-${st.klasse}">
        <div class="punkt-kopf">
          <strong>${sicher(pp.text)}</strong>
          ${marke(st)}
        </div>
        <div class="klein" style="margin-bottom:6px">
          ${intervallName(pp.intervallTage)}${pp.wer ? " · " + sicher(pp.wer) : ""}
          ${pp.pflicht ? ` · <b>Pflichtprüfung</b>` : ""}${pp.rechtsgrundlage ? " (" + sicher(pp.rechtsgrundlage) + ")" : ""}
        </div>
        <div class="felder">
          <div><label>Geprüft von</label><input id="pruefer-${pp.id}" placeholder="Name"></div>
          <div><label>Bemerkung</label><input id="bem-${pp.id}" placeholder="optional, bei Mangel beschreiben"></div>
        </div>
        <button class="gruen" onclick="abhaken('${g.id}','${pp.id}','ok')">✓ In Ordnung</button>
        <button class="warn" onclick="abhaken('${g.id}','${pp.id}','mangel')">⚠ Mangel melden</button>
        ${mangelOffen(pp) ? `<button class="zweit" onclick="wiederInBetrieb('${g.id}')">🔧 Mangel behoben</button>` : ""}
        ${verlauf ? `<div class="verlauf"><label style="margin-top:0">Letzte Prüfungen</label>${verlauf}</div>` : ""}
        <div style="text-align:right"><button class="loeschen mini" onclick="pruefpunktLoeschen('${g.id}','${pp.id}')">Prüfpunkt löschen</button></div>
      </div>`;
  }).join("");

  inhalt.innerHTML = `
    <a class="zurueck" href="#/geraete">← Alle Maschinen</a>
    <h2>${sicher(g.name)}</h2>
    <div class="chips">
      <span class="chip">${sicher(g.kategorie)}</span>
      ${g.standort ? `<span class="chip">${sicher(g.standort)}</span>` : ""}
      <span class="chip">${groesse(g)}</span>
    </div>
    ${(g.typ || g.nummer) ? `<div class="meta">
      ${g.typ ? `<div><small>Typ</small>${sicher(g.typ)}</div>` : ""}
      ${g.nummer ? `<div><small>Nummer</small>${sicher(g.nummer)}</div>` : ""}
    </div>` : ""}
    ${g.ausserBetrieb ? `
      <div class="ausser-betrieb">
        ⛔ AUSSER BETRIEB – nicht benutzen!
        <br><button class="mini zweit" onclick="wiederInBetrieb('${g.id}')">Mangel behoben, wieder in Betrieb nehmen</button>
      </div>` : ""}
    <div class="aktionen">
      <a href="#/qr/${g.id}"><button class="zweit">QR-Code</button></a>
      <a href="#/protokoll/${g.id}"><button class="zweit">Prüfprotokoll (PDF)</button></a>
    </div>
    <h3>Prüfpunkte</h3>
    ${punkte || `<div class="karte leer-karte"><p><b>Noch keine Prüfpunkte.</b></p><p>Öffne unten „Neuer Prüfpunkt“ und trage ein, was geprüft werden soll.</p></div>`}
    ${(g.reparaturen || []).length ? `
      <h3>Behobene Mängel</h3>
      <div class="karte">
        ${g.reparaturen.slice().reverse().map(r => `
          <div class="reparatur"><b>${datumText(zuDatum(r.datum))}</b> · ${sicher(r.wer)}<br>${sicher(r.bemerkung)}</div>`).join("")}
      </div>` : ""}
    <details class="neu" ${g.pruefpunkte.length === 0 ? "open" : ""}>
      <summary>Neuer Prüfpunkt</summary>
      <label style="margin-top:0">Was wird geprüft? *</label>
      <input id="pp-text" placeholder="z. B. Not-Aus testen">
      <div class="felder">
        <div><label>Wie oft?</label>${intervallAuswahl("pp-intervall", 365)}</div>
        <div><label>Wer prüft?</label><input id="pp-wer" placeholder="z. B. Bediener, externe Firma"></div>
      </div>
      <label class="haken"><input type="checkbox" id="pp-pflicht"> Gesetzliche Pflichtprüfung (z. B. DGUV, UVV)</label>
      <label>Rechtsgrundlage</label>
      <input id="pp-recht" placeholder="optional, z. B. DGUV Vorschrift 3">
      <button onclick="pruefpunktSpeichern('${g.id}')">Prüfpunkt hinzufügen</button>
    </details>
    <div class="gefahr"><button class="loeschen" onclick="geraetLoeschen('${g.id}')">Gerät löschen</button></div>`;
}

function pruefpunktSpeichern(geraetId) {
  const text = wert("pp-text");
  if (!text) { alert("Bitte eingeben, was geprüft wird."); return; }
  findeGeraet(geraetId).pruefpunkte.push({
    id: neueId(), text,
    intervallTage: Number(wert("pp-intervall")),
    wer: wert("pp-wer"),
    pflicht: document.getElementById("pp-pflicht").checked,
    rechtsgrundlage: wert("pp-recht"),
    eintraege: []
  });
  speichereDaten();
  seiteGeraet(geraetId);
}

function abhaken(geraetId, ppId, ergebnis) {
  const pruefer = wert("pruefer-" + ppId);
  if (!pruefer) { alert("Bitte eintragen, wer geprüft hat."); return; }
  const g = findeGeraet(geraetId);
  g.pruefpunkte.find(p => p.id === ppId).eintraege.push({
    datum: new Date().toISOString(), pruefer, ergebnis, bemerkung: wert("bem-" + ppId)
  });
  if (ergebnis === "mangel" && !g.ausserBetrieb && confirm("Mangel gespeichert. Gerät außer Betrieb setzen?")) {
    g.ausserBetrieb = true;
  }
  speichereDaten();
  seiteGeraet(geraetId);
}

// Mangel behoben: Fenster fragt, was gemacht wurde und wer es behoben hat
function wiederInBetrieb(geraetId) {
  const g = findeGeraet(geraetId);
  let d = document.getElementById("fenster-behoben");
  if (!d) {
    d = document.createElement("dialog");
    d.id = "fenster-behoben";
    d.className = "fenster";
    document.body.appendChild(d);
  }
  d.innerHTML = `
    <form method="dialog" onsubmit="return false">
      <h2>Mangel behoben</h2>
      <p class="klein">${g.ausserBetrieb ? sicher(g.name) + " wird danach wieder in Betrieb genommen. " : ""}Offene Mängel an diesem Gerät gelten danach als behoben. Der Eintrag erscheint im Prüfprotokoll.</p>
      <label>Was wurde gemacht? *</label>
      <textarea id="beh-was" placeholder="z. B. Schutzhaube neu befestigt, Schalter getauscht"></textarea>
      <div class="felder">
        <div><label>Behoben von *</label><input id="beh-wer" placeholder="Name oder Firma"></div>
        <div><label>Datum</label><input type="date" id="beh-datum" value="${heuteISO()}"></div>
      </div>
      <div class="fenster-knoepfe">
        <button type="button" class="gruen" onclick="behobenSpeichern('${g.id}')">✓ ${g.ausserBetrieb ? "Speichern und in Betrieb nehmen" : "Speichern"}</button>
        <button type="button" class="zweit" onclick="document.getElementById('fenster-behoben').close()">Abbrechen</button>
      </div>
    </form>`;
  d.showModal();
  setTimeout(() => document.getElementById("beh-was").focus(), 50);
}

function behobenSpeichern(geraetId) {
  const was = wert("beh-was");
  const wer = wert("beh-wer");
  const datum = wert("beh-datum") || heuteISO();
  if (!was) { alert("Bitte eintragen, was gemacht wurde."); return; }
  if (!wer) { alert("Bitte eintragen, wer den Mangel behoben hat."); return; }
  const g = findeGeraet(geraetId);
  g.reparaturen = g.reparaturen || [];
  g.reparaturen.push({ datum, wer, bemerkung: was });
  g.reparaturen.sort((x, y) => x.datum.localeCompare(y.datum));
  g.pruefpunkte.forEach(pp => {
    if (mangelOffen(pp)) pp.eintraege.push({ datum: datum + "T12:00:00", pruefer: wer, ergebnis: "behoben", bemerkung: was });
  });
  g.ausserBetrieb = false;
  speichereDaten();
  document.getElementById("fenster-behoben").close();
  seiteGeraet(geraetId);
}

function pruefpunktLoeschen(geraetId, ppId) {
  if (!confirm("Prüfpunkt mit allen Einträgen löschen?")) return;
  const g = findeGeraet(geraetId);
  g.pruefpunkte = g.pruefpunkte.filter(p => p.id !== ppId);
  speichereDaten();
  seiteGeraet(geraetId);
}

function geraetLoeschen(geraetId) {
  if (!confirm("Gerät mit allen Prüfungen wirklich löschen?")) return;
  daten.geraete = daten.geraete.filter(g => g.id !== geraetId);
  speichereDaten();
  location.hash = "#/geraete";
}

/* ---------- QR-CODES ---------- */
function etikett(g) {
  return `
    <div class="qr-etikett">
      <strong>${sicher(g.name)}</strong><br>
      <span class="klein">${sicher(g.standort)}${g.nummer ? " · " + sicher(g.nummer) : ""}</span><br>
      ${qrBild(geraetAdresse(g))}<br>
      <span class="klein">Scannen → Wartung eintragen</span>
    </div>`;
}

function seiteQR(id) {
  const g = findeGeraet(id);
  if (!g) { inhalt.innerHTML = `<p class="leer">Gerät nicht gefunden.</p>`; return; }
  inhalt.innerHTML = `
    <div class="nicht-drucken">
      <a class="zurueck" href="#/geraet/${g.id}">← zurück zum Gerät</a>
      <p class="klein">Ausdrucken und gut sichtbar an das Gerät kleben. Beim Scannen öffnet sich direkt dieses Gerät.</p>
      <button onclick="window.print()">Drucken</button>
    </div>
    <div style="max-width:300px;margin:16px auto">${etikett(g)}</div>`;
}

function seiteQRAlle() {
  inhalt.innerHTML = `
    <div class="nicht-drucken">
      <h2>Alle QR-Codes</h2>
      <button onclick="window.print()">Alle drucken</button>
    </div>
    <div class="qr-raster" style="margin-top:12px">${daten.geraete.map(etikett).join("") || `<p class="leer">Noch keine Geräte.</p>`}</div>`;
}

/* ---------- PRÜFPROTOKOLL (Drucken → "Als PDF speichern") ---------- */
function seiteProtokoll(id) {
  const g = findeGeraet(id);
  if (!g) { inhalt.innerHTML = `<p class="leer">Gerät nicht gefunden.</p>`; return; }
  inhalt.innerHTML = `
    <div class="nicht-drucken">
      <a class="zurueck" href="#/geraet/${g.id}">← zurück zum Gerät</a>
      <p class="klein">Tipp: Im Druckfenster als Drucker "Als PDF speichern" wählen.</p>
      <button onclick="window.print()">Drucken / als PDF speichern</button>
    </div>
    <div class="karte">
      <h2>Prüfprotokoll: ${sicher(g.name)}</h2>
      <table>
        <tr><th>Kategorie</th><td>${sicher(g.kategorie)}</td><th>Standort</th><td>${sicher(g.standort)}</td></tr>
        <tr><th>Typ</th><td>${sicher(g.typ)}</td><th>Nummer</th><td>${sicher(g.nummer)}</td></tr>
        <tr><th>Status</th><td colspan="3">${g.ausserBetrieb ? "<b>AUSSER BETRIEB</b>" : "in Betrieb"}</td></tr>
      </table>
      ${(g.reparaturen || []).length ? `
        <h3>Behobene Mängel</h3>
        <table>
          <tr><th>Datum</th><th>Behoben von</th><th>Was wurde gemacht</th></tr>
          ${g.reparaturen.slice().reverse().map(r => `
            <tr><td>${datumText(zuDatum(r.datum))}</td><td>${sicher(r.wer)}</td><td>${sicher(r.bemerkung)}</td></tr>`).join("")}
        </table>` : ""}
      ${g.pruefpunkte.map(pp => `
        <h3>${sicher(pp.text)}</h3>
        <div class="klein">
          Intervall: ${intervallName(pp.intervallTage)}${pp.wer ? " · Prüfer: " + sicher(pp.wer) : ""}
          ${pp.pflicht ? " · Pflichtprüfung" : ""}${pp.rechtsgrundlage ? " · " + sicher(pp.rechtsgrundlage) : ""}
          · Status: ${statusPruefpunkt(pp).text}
        </div>
        <table>
          <tr><th>Datum</th><th>Geprüft von</th><th>Ergebnis</th><th>Bemerkung</th></tr>
          ${pp.eintraege.slice().reverse().map(e => `
            <tr><td>${datumText(zuDatum(e.datum))}</td><td>${sicher(e.pruefer)}</td>
            <td>${ergebnisText(e, false)}</td><td>${sicher(e.bemerkung)}</td></tr>`).join("")
            || `<tr><td colspan="4">noch keine Prüfung</td></tr>`}
        </table>`).join("") || `<p class="leer">Keine Prüfpunkte.</p>`}
      <p class="klein">Erstellt am ${datumText(new Date())} mit Wartungsbuch. Für Wartung und Prüfungen ist allein der Betreiber verantwortlich.</p>
    </div>`;
}

/* ---------- PERSONAL: Mitarbeiter und Unterweisungen ---------- */
function initialen(name) {
  const t = (name || "?").trim().split(/\s+/);
  return ((t[0] || "?")[0] + (t.length > 1 ? t[t.length - 1][0] : "")).toUpperCase();
}

function seitePersonal() {
  inhalt.innerHTML = `
    <h2>Personal & Unterweisungen</h2>
    <div class="info-karte">Datenschutz: Namen bleiben bis zur nächsten Version nur auf diesem Gerät gespeichert.</div>

    <h3>Unterweisungen (${daten.unterweisungen.length})</h3>
    ${daten.unterweisungen.map(u => `
      <a class="karte geraet-zeile" href="#/unterweisung/${u.id}">
        <div class="icon-kreis"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H8l-4 4z"/><path d="M8 9h8M8 12h5"/></svg></div>
        <div class="mitte">
          <b class="titel-fett">${sicher(u.thema)}</b>
          <div class="klein">${intervallName(u.intervallTage)} · ${u.durchfuehrungen.length} mal durchgeführt</div>
        </div>
        <div class="rechts">${marke(statusUnterweisung(u))}</div>
      </a>`).join("") || `<div class="karte leer-karte"><p><b>Noch keine Unterweisungen.</b></p><p>Lege unten die erste an, zum Beispiel Brandschutz oder Gabelstapler.</p></div>`}
    <details class="neu" ${daten.unterweisungen.length === 0 ? "open" : ""}>
      <summary>Neue Unterweisung</summary>
      <label style="margin-top:0">Thema *</label>
      <input id="u-thema" placeholder="z. B. Gabelstapler, Brandschutz, Erste Hilfe">
      <div class="felder">
        <div><label>Wie oft?</label>${intervallAuswahl("u-intervall", 365)}</div>
        <div><label>Link zu Unterlagen</label><input id="u-link" placeholder="optional, z. B. Berufsgenossenschaft"></div>
      </div>
      <button onclick="unterweisungSpeichern()">Unterweisung anlegen</button>
    </details>

    <h3>Mitarbeiter (${daten.mitarbeiter.length})</h3>
    <div class="karte">
      ${daten.mitarbeiter.map(m => `
        <div class="person">
          <div class="avatar">${sicher(initialen(m.name))}</div>
          <span class="name">${sicher(m.name)}</span>
          <button class="loeschen mini" onclick="mitarbeiterLoeschen('${m.id}')">entfernen</button>
        </div>`).join("") || `<p class="leer" style="margin-top:0">Noch keine Mitarbeiter angelegt.</p>`}
      <div class="neue-person">
        <div><label>Neuer Mitarbeiter</label><input id="m-name" placeholder="Vor- und Nachname"></div>
        <button onclick="mitarbeiterSpeichern()">Hinzufügen</button>
      </div>
    </div>`;
}

function mitarbeiterSpeichern() {
  const name = wert("m-name");
  if (!name) { alert("Bitte einen Namen eingeben."); return; }
  daten.mitarbeiter.push({ id: neueId(), name });
  speichereDaten();
  seitePersonal();
}

function mitarbeiterLoeschen(id) {
  if (!confirm("Mitarbeiter entfernen? Frühere Unterweisungen bleiben dokumentiert.")) return;
  daten.mitarbeiter = daten.mitarbeiter.filter(m => m.id !== id);
  speichereDaten();
  seitePersonal();
}

function unterweisungSpeichern() {
  const thema = wert("u-thema");
  if (!thema) { alert("Bitte ein Thema eingeben."); return; }
  const u = { id: neueId(), thema, intervallTage: Number(wert("u-intervall")), link: wert("u-link"), durchfuehrungen: [] };
  daten.unterweisungen.push(u);
  speichereDaten();
  location.hash = "#/unterweisung/" + u.id;
}

function seiteUnterweisung(id) {
  const u = findeUnterweisung(id);
  if (!u) { inhalt.innerHTML = `<p class="leer">Unterweisung nicht gefunden.</p>`; return; }

  // Wer fehlt bei der letzten Durchführung?
  const letzte = u.durchfuehrungen[u.durchfuehrungen.length - 1];
  const fehlen = letzte ? daten.mitarbeiter.filter(m => !letzte.teilnehmer.includes(m.name)) : [];
  const sichererLink = /^https?:\/\//i.test(u.link) ? u.link : "";

  inhalt.innerHTML = `
    <a class="zurueck" href="#/personal">← Personal</a>
    <h2>${sicher(u.thema)}</h2>
    <div class="chips">
      ${marke(statusUnterweisung(u))}
      <span class="chip">${intervallName(u.intervallTage)}</span>
      ${sichererLink ? `<a class="chip" style="text-decoration:none" href="${sicher(sichererLink)}" target="_blank" rel="noopener">Unterlagen öffnen ↗</a>` : ""}
    </div>
    ${fehlen.length ? `<div class="fehlt"><strong>Fehlten beim letzten Mal:</strong> ${fehlen.map(m => sicher(m.name)).join(", ")}</div>` : ""}

    <div class="karte formular">
      <strong style="font-size:17px">Unterweisung durchgeführt</strong>
      <div class="felder">
        <div><label>Datum</label><input type="date" id="d-datum" value="${heuteISO()}"></div>
        <div><label>Durchgeführt von</label><input id="d-leiter" placeholder="Name"></div>
      </div>
      <label>Teilnehmer</label>
      <div class="teil-grid">
        ${daten.mitarbeiter.map(m => `
          <label class="haken"><input type="checkbox" class="teilnehmer" value="${sicher(m.name)}"> ${sicher(m.name)}</label>`).join("")
          || `<p class="leer">Erst unter "Personal" Mitarbeiter anlegen.</p>`}
      </div>
      <button onclick="durchfuehrungSpeichern('${u.id}')">Speichern</button>
    </div>

    <h3>Verlauf</h3>
    ${u.durchfuehrungen.slice().reverse().map(d => `
      <div class="karte rand-ok">
        <strong>${datumText(zuDatum(d.datum))}</strong> · durchgeführt von ${sicher(d.leiter)}
        <div class="klein">Teilnehmer: ${d.teilnehmer.map(sicher).join(", ")}</div>
      </div>`).join("") || `<div class="karte leer-karte"><p>Noch nie durchgeführt.</p></div>`}
    <div class="gefahr"><button class="loeschen" onclick="unterweisungLoeschen('${u.id}')">Unterweisung löschen</button></div>`;
}

function durchfuehrungSpeichern(id) {
  const leiter = wert("d-leiter");
  const datum = wert("d-datum");
  const teilnehmer = [...document.querySelectorAll(".teilnehmer:checked")].map(c => c.value);
  if (!leiter || !datum) { alert("Bitte Datum und Namen eintragen."); return; }
  if (teilnehmer.length === 0) { alert("Bitte mindestens einen Teilnehmer abhaken."); return; }
  const u = findeUnterweisung(id);
  u.durchfuehrungen.push({ datum, leiter, teilnehmer });
  u.durchfuehrungen.sort((a, b) => a.datum.localeCompare(b.datum)); // nachgetragene Termine richtig einsortieren
  speichereDaten();
  seiteUnterweisung(id);
}

function unterweisungLoeschen(id) {
  if (!confirm("Unterweisung mit allen Nachweisen löschen?")) return;
  daten.unterweisungen = daten.unterweisungen.filter(u => u.id !== id);
  speichereDaten();
  location.hash = "#/personal";
}

/* ---------- SICHERUNG: alles als Datei speichern und laden ---------- */
function seiteSicherung() {
  inhalt.innerHTML = `
    <a class="zurueck" href="#/mehr">← Mehr</a>
    <h2>Datensicherung</h2>
    <div class="info-karte">Deine Daten liegen nur auf diesem Gerät. Speichere regelmäßig eine Sicherung, zum Beispiel einmal pro Woche.</div>
    <div class="karte">
      <div class="abschnitt-kopf">
        <div class="icon-kreis"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg></div>
        <div><b>Sicherung speichern</b><span>Alle Daten als Datei herunterladen</span></div>
      </div>
      <button onclick="sicherungSpeichern()">Sicherung herunterladen</button>
    </div>
    <div class="karte">
      <div class="abschnitt-kopf">
        <div class="icon-kreis"><svg viewBox="0 0 24 24"><path d="M12 20V9M7 13l5-5 5 5M5 4h14"/></svg></div>
        <div><b>Sicherung laden</b><span>Ersetzt alle Daten auf diesem Gerät. So bekommst du Daten vom PC aufs Handy.</span></div>
      </div>
      <input type="file" id="datei" accept=".json,application/json" style="margin-top:12px">
      <button class="zweit" onclick="sicherungLaden()">Sicherung laden</button>
    </div>`;
}

function sicherungSpeichern() {
  const blob = new Blob([JSON.stringify(daten, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "wartungsbuch-sicherung-" + heuteISO() + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function sicherungLaden() {
  const datei = document.getElementById("datei").files[0];
  if (!datei) { alert("Bitte zuerst eine Sicherungsdatei auswählen."); return; }
  const leser = new FileReader();
  leser.onload = () => {
    let neu;
    try { neu = JSON.parse(leser.result); } catch (e) { neu = null; }
    if (!neu || !Array.isArray(neu.geraete)) { alert("Das ist keine gültige Wartungsbuch-Sicherung."); return; }
    if (!confirm("Alle Daten auf diesem Gerät durch die Sicherung ersetzen?")) return;
    localStorage.setItem(SPEICHER_NAME, JSON.stringify(neu));
    daten = ladeDaten();
    alert("Sicherung geladen.");
    location.hash = "#/";
    zeigeSeite();
  };
  leser.readAsText(datei);
}

/* ---------- APP INSTALLIEREN (mit QR-Code zum Weitergeben) ---------- */

// Chrome und Edge melden, wenn die App installierbar ist. Das merken wir uns für den Knopf.
let installAnfrage = null;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault();
  installAnfrage = e;
  if (location.hash === "#/installieren") seiteInstallieren();
});
window.addEventListener("appinstalled", () => {
  installAnfrage = null;
  alert("Wartungsbuch ist installiert. Du findest es jetzt als eigenes Symbol.");
});

// Läuft die App schon als installierte App (eigenes Fenster)?
function istInstalliert() {
  return window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
}

function welchesGeraet() {
  const ua = navigator.userAgent;
  if (/iPhone|iPad|iPod/i.test(ua)) return "iphone";
  if (/Android/i.test(ua)) return "android";
  if (/Firefox/i.test(ua)) return "firefox";
  return "pc";
}

async function jetztInstallieren() {
  if (!installAnfrage) return;
  installAnfrage.prompt();
  await installAnfrage.userChoice;
  installAnfrage = null;
  seiteInstallieren();
}

function appAdresse() {
  return location.origin + location.pathname + "#/installieren";
}

function seiteInstallieren() {
  const geraet = welchesGeraet();
  let anleitung;
  if (istInstalliert()) {
    anleitung = `<p>✅ Du nutzt das Wartungsbuch bereits als installierte App.</p>`;
  } else if (installAnfrage) {
    anleitung = `
      <p>Ein Klick, dann hast du das Wartungsbuch als eigene App mit Symbol.</p>
      <button onclick="jetztInstallieren()">📲 Jetzt installieren</button>`;
  } else if (geraet === "iphone") {
    anleitung = `
      <ol>
        <li>Diese Seite in <b>Safari</b> öffnen (nicht Chrome).</li>
        <li>Unten auf <b>Teilen</b> tippen (Quadrat mit Pfeil nach oben).</li>
        <li><b>"Zum Home-Bildschirm"</b> wählen.</li>
        <li>Oben rechts <b>"Hinzufügen"</b> tippen.</li>
      </ol>`;
  } else if (geraet === "android") {
    anleitung = `
      <ol>
        <li>Diese Seite in <b>Chrome</b> öffnen.</li>
        <li>Oben rechts auf die <b>drei Punkte ⋮</b> tippen.</li>
        <li><b>"App installieren"</b> oder <b>"Zum Startbildschirm hinzufügen"</b> wählen.</li>
      </ol>`;
  } else if (geraet === "firefox") {
    anleitung = `<p>Firefox kann am PC keine Apps installieren. Bitte diese Seite in <b>Chrome</b> oder <b>Edge</b> öffnen.</p>`;
  } else {
    anleitung = `
      <ol>
        <li>Diese Seite in <b>Chrome</b> oder <b>Edge</b> öffnen.</li>
        <li>Rechts in der Adressleiste auf das <b>Installieren-Symbol</b> klicken (Bildschirm mit Pfeil).</li>
        <li>In Edge alternativ: <b>⋯ → Apps → Diese Website als App installieren</b>.</li>
      </ol>
      <p class="klein">Kein Symbol zu sehen? Seite einmal neu laden (F5) und ein paar Sekunden warten.</p>`;
  }

  inhalt.innerHTML = `
    <a class="zurueck nicht-drucken" href="#/mehr">← Mehr</a>
    <h2>App installieren</h2>
    <div class="karte nicht-drucken">${anleitung}</div>
    <h3 class="nicht-drucken">QR-Code zum Weitergeben</h3>
    <p class="klein nicht-drucken">Für Handys: Code mit der Handykamera scannen, dann öffnet sich diese Seite mit der Anleitung. Zum Ausdrucken für Kunden oder Mitarbeiter.</p>
    <div class="qr-etikett" style="max-width:300px;margin:12px auto">
      <strong>Wartungsbuch-App</strong><br>
      ${qrBild(appAdresse())}<br>
      <span class="klein">Scannen → App installieren</span>
    </div>
    <button class="nicht-drucken" onclick="window.print()">QR-Code drucken</button>`;
}

/* ===== Start ===== */
window.addEventListener("hashchange", zeigeSeite);
zeigeSeite();

// Den Link "App installieren" ausblenden, wenn die App schon installiert läuft
if (istInstalliert()) { const l = document.getElementById("installieren-link"); if (l) l.style.display = "none"; }

// Installierbar machen (funktioniert nur über https oder localhost, nicht per Doppelklick)
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("sw.js", { updateViaCache: "none" });
}
</script>
</body>
</html>
